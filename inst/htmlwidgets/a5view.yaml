dependencies:
  - name: maplibre-gl
    version: 5.24.0
    src:
      href: https://unpkg.com/maplibre-gl@5.24.0/dist
    script:
      - maplibre-gl.js
    stylesheet:
      - maplibre-gl.css
  - name: deckgl
    version: 9.4.0
    src:
      href: https://unpkg.com/deck.gl@9.4.0
    script:
      - dist.min.js
  # a5-js 1.0.0-beta.2, written 1.0.0-2 because htmltools only takes
  # numeric versions. The version is set in lib/a5-js/bridge.js.
  - name: a5-js
    version: 1.0.0-2
    src:
      file: htmlwidgets/lib/a5-js
    script:
      - bridge.js
  - name: hyparquet
    version: 1.25.6
    src:
      file: htmlwidgets/lib/hyparquet
    script:
      - hyparquet-bootstrap.js
  - name: a5view-tiling
    version: 0.3.0
    src:
      file: htmlwidgets/lib/a5view-tiling
    script:
      - tiling.js
      - a5-layer.js
      - lazy-renderer.js
